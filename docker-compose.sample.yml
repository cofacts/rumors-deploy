# ===== Shared settings (YAML anchors, to reduce duplication) =====
x-defaults:
  restart: &restart-policy unless-stopped
  logging: &default-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  healthcheck: &healthcheck-defaults
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 30s

services:
  db:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.2
    restart: *restart-policy
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true        # 鎖定 heap,避免 swap 拖慢搜尋
      - ES_JAVA_OPTS=-Xms4g -Xmx4g
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - "./volumes/db-sample:/usr/share/elasticsearch/data"
    ports:
      - "127.0.0.1:62222:9200"            # 只開本機,別暴露無鑑權的 ES
    healthcheck:
      <<: *healthcheck-defaults
      start_period: 60s                   # ES 啟動較慢,拉長寬限期
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=10s' || exit 1"]
    stop_grace_period: 2m                 # 給 ES 時間 flush segment、正常關閉
    logging: *default-logging

  mongo:
    image: mongo:3.6
    restart: *restart-policy
    env_file:
      - ./env-files/mongo
    volumes:
      - "./volumes/mongo:/data/db"
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "mongo --quiet --eval 'db.adminCommand(\"ping\").ok' | grep -q 1 || exit 1"]
    logging: *default-logging

  redis:
    image: redis:8-alpine
    restart: *restart-policy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
    logging: *default-logging

  url-resolver:
    image: cofacts/url-resolver:latest
    restart: *restart-policy
    env_file:
      - ./env-files/url-resolver
    ports:
      - "127.0.0.1:4000:4000"             # 除錯用
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
    logging: *default-logging

  collab-server:
    image: cofacts/collab-server
    restart: *restart-policy
    environment:
      - PORT=1234
      - ELASTICSEARCH_URL=http://db:9200
    ports:
      - "127.0.0.1:5002:1234"
    depends_on:
      db:
        condition: service_healthy        # 它直接連 ES,應等 ES 就緒
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:' + (process.env.PORT || 1234), r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
    logging: *default-logging

  api:
    image: cofacts/rumors-api
    restart: *restart-policy
    env_file:
      - ./env-files/api
    volumes:
      - "./volumes/api:/data"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      url-resolver:
        condition: service_started
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "curl -sfS http://localhost:5000/ || exit 1"]
    logging: *default-logging

  site:
    image: cofacts/rumors-site:latest-en
    restart: *restart-policy
    env_file:
      - ./env-files/site
    ports:
      - "2999:3000"
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging

  line-bot-zh:
    image: cofacts/rumors-line-bot:latest-tw
    restart: *restart-policy
    env_file:
      - ./env-files/line-bot-zh
    ports:
      - "5001:5001"
    depends_on:
      api:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  # cofacts.ai AI agent backend (ADK)
  adk:
    image: cofacts/adk:latest
    restart: *restart-policy
    env_file:
      - ./env-files/adk
    environment:
      - PORT=8000
      - LANGFUSE_BASE_URL=https://langfuse.cofacts.tw
    healthcheck:                          # start_interval 需 Compose 2.20.2+
      interval: 60s
      start_interval: 5s
      timeout: 5s
      retries: 6
      start_period: 60s
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    logging: *default-logging

  # cofacts.ai website frontend
  cofacts-ai:
    image: cofacts/site:latest
    restart: *restart-policy
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ADK_URL=http://adk:8000
      - PUBLIC_URL=http://localhost:3000
      - COFACTS_API_URL=http://api:5000
    depends_on:
      adk:
        condition: service_healthy
      api:
        condition: service_healthy        # 它會打 COFACTS_API_URL,補上依賴
    logging: *default-logging
